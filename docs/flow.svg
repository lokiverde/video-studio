<rect x="1067" y="100" width="176" height="120" rx="14" fill="#2fc4a8" fill-opacity="0.09" stroke="#2fc4a8" stroke-opacity=".85" stroke-width="1.5"/>
<circle cx="1091" cy="126" r="12" fill="#2fc4a8"/>
<text x="1091" y="131" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0a0f1f">6</text>
<text x="1111" y="132" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Ship</text>
<text x="1081" y="170" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c7cde0">16:9 + 9:16, Shorts,</text>
<text x="1081" y="192" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c7cde0">thumbnails, YouTube kit</text>
<path d="M949.0 224 C 949.0 284, 743.0 284, 743.0 228" fill="none" stroke="#D97757" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arO)"/>
<text x="846.0" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D97757">your notes, in plain English</text>
<text x="1155.0" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b93ad">on approval</text>
