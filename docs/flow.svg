<line x1="835" y1="160.0" x2="857" y2="160.0" stroke="#8b93ad" stroke-width="2" marker-end="url(#ar)"/>
<rect x="861" y="100" width="176" height="120" rx="14" fill="#D97757" fill-opacity="0.16" stroke="#D97757" stroke-opacity=".85" stroke-width="2.5"/>
